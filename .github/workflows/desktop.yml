name: Desktop installers

# Builds double-clickable CLIPX AI apps for Windows, macOS and Linux.
# Trigger from the Actions tab (Run workflow) or by pushing a v* tag.
#
# The installers are ordinary Electron builds; the app itself is the same code
# as the web version, started on a local port inside the user's app-data folder.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build the web app
        run: npm run build

      - name: Desktop self-test
        run: npm run desktop:selftest

      - name: Install Electron tooling
        run: npm i -D electron@33 electron-builder@25

      - name: Package installer
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds by default — no certificates are configured here.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach installers to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found to upload"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "CLIPX AI $GITHUB_REF_NAME" \
                 --notes "Desktop installers for $GITHUB_REF_NAME." --draft
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: clipx-ai-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
